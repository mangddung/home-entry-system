# Zigbee 모델용 MQTT 브로커 (docker-compose.yml / docker-compose.dev.yml, eclipse-mosquitto:2.0.22)
# 현 단계: 서버(Flask·mqtt_worker)와 Zigbee2MQTT가 같은 PC라 127.0.0.1로만 연다(compose ports).
# 외부 게이트웨이(자체 ESP 게이트웨이)가 붙는 단계에서 TLS 8883 리스너로 바꾸고 1883 평문은 닫는다.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
