# 운영: Zigbee 모델용 MQTT 브로커. 서버(server/main.py, server/mqtt_worker.py)와 Zigbee2MQTT가 같은 PC에서 접속한다.
# 서버는 컨테이너가 아니라 호스트에서 돌기 때문에 브로커 포트를 127.0.0.1에만 연다(외부 미개방).
# 계정 파일(mosquitto/config/passwd)은 gateway/setup_dev_gateway.py가 만든다.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: always
    ports:
      - "127.0.0.1:15883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
