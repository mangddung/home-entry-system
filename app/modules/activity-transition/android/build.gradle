plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.activitytransition'
version = '0.1.0'

android {
  namespace "expo.modules.activitytransition"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // expo-location과 같은 버전 (expo-location/android/build.gradle)
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}
